<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products</title>
  <link rel="canonical" href="https://www.innovax.pk/products.html">
  <meta name="robots" content="noindex, follow">
  <link rel="stylesheet" href="shop-menu.css">
  <style>.network-bar{margin:-2rem -1rem 1.5rem}</style>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 2rem 1rem; background: #f4f7fb; color: #172033; }
    main { max-width: 760px; margin: 0 auto; padding: 1.5rem; background: white; border-radius: 12px; box-shadow: 0 4px 20px #17203312; }
    h1 { margin-top: 0; }
    #status { color: #526078; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: .8rem 1rem; border-bottom: 1px solid #e5eaf1; }
    th { background: #f7f9fc; }
    tr:last-child td { border-bottom: 0; }
    .error { color: #b42318 !important; }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZMGBTTY4ZB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ZMGBTTY4ZB');
  </script>
</head>
<body>
  <div class="network-bar">
    <nav aria-label="Innovax network">
      <a href="index.html">Innovax HMIS</a>
      <a href="shop.html" aria-current="page">Innovax Shop</a>
      <a href="jobs.html">Innovax Jobs</a>
      <a href="classified.html">Innovax Classified</a>
    </nav>
  </div>
  <main>
    <h1>Products</h1>
    <p id="status" role="status">Loading products…</p>
    <div class="table-wrap">
      <table aria-label="Products">
        <thead><tr><th scope="col">ID</th><th scope="col">Product Name</th></tr></thead>
        <tbody id="products"></tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = supabase.createClient(
      "https://rfjcgbehvyybthprbvqm.supabase.co",
      "sb_publishable_E7O9tR2EkZP6-RQFrWUySA_m-V1RCnB"
    );

    async function loadProducts() {
      const status = document.getElementById("status");
      const tbody = document.getElementById("products");
      const { data, error } = await supabaseClient
        .from("Products")
        .select("id, ProductName")
        .order("id");

      if (error) {
        status.textContent = `Could not load products: ${error.message}`;
        status.classList.add("error");
        return;
      }

      if (!data.length) {
        status.textContent = "No products found.";
        return;
      }

      for (const product of data) {
        const row = document.createElement("tr");
        const idCell = document.createElement("td");
        const nameCell = document.createElement("td");
        idCell.textContent = product.id ?? "";
        nameCell.textContent = product.ProductName ?? "";
        row.append(idCell, nameCell);
        tbody.appendChild(row);
      }
      status.textContent = `${data.length} product${data.length === 1 ? "" : "s"}`;
    }

    loadProducts();
  </script>
</body>
</html>
