      document.getElementById("productDescription").textContent = product.description;
      document.getElementById("productId").textContent = `Product code: ${product.id}`;
      const message = `Hi Innovax, I am interested in ${product.name} (${product.price}).`;
      document.getElementById("orderButton").href = `https://wa.me/923139849131?text=${encodeURIComponent(message)}`;
    } else {
      document.getElementById("notFound").style.display = "block";
    }
  </script>
