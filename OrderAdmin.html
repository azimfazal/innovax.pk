<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Order admin | Innovax</title>
  <link rel="canonical" href="https://www.innovax.pk/OrderAdmin.html">
  <meta name="robots" content="noindex, follow">
  <link rel="stylesheet" href="shop-menu.css">
  <style>.network-bar{margin:-28px -16px 24px}</style>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;padding:28px 16px}main{max-width:1200px;margin:auto;background:white;padding:24px;border-radius:16px;box-shadow:0 4px 24px #17203312}h1{margin-top:0}.login{max-width:420px}.fields{display:grid;gap:12px}input{font:inherit;padding:12px;border:1px solid #ccd3df;border-radius:10px}.button{background:#10104f;color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;cursor:pointer}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0}.status{color:#526078;min-height:22px}.error{color:#b42318}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1140px}th,td{padding:11px 10px;border-bottom:1px solid #e5eaf1;text-align:left;vertical-align:top}th{background:#f7f9fc;position:sticky;top:0}a{color:#10104f}small{color:#667085}.customer{min-width:170px}.product{min-width:220px}.address{min-width:230px}.delete-button{background:#fff;color:#b42318;border:1px solid #f0b7b2;border-radius:8px;padding:8px 11px;font:inherit;cursor:pointer}.delete-button:hover{background:#fff4f2}.delete-button:disabled{opacity:.55;cursor:wait}.hidden{display:none!important}
  </style>

<body>
  <div class="network-bar">
    <nav aria-label="Innovax network">
      <a href="index.html">Innovax HMIS</a>
      <a href="shop.html" aria-current="page">Innovax Shop</a>
      <a href="jobs.html">Innovax Jobs</a>
      <a href="classified.html">Innovax Classified</a>
    </nav>
  </div>
  <main>
  <section id="loginPanel" class="login"><h1>Innovax order admin</h1><p>Sign in with an administrator account to view customer orders.</p><form id="loginForm" class="fields"><input type="email" id="email" autocomplete="username" placeholder="Admin email" required><input type="password" id="password" autocomplete="current-password" placeholder="Password" required><button class="button" type="submit">Sign in</button></form></section>
  <section id="ordersPanel" class="hidden"><div class="toolbar"><div><h1>Customer orders</h1><div id="count" class="status"></div></div><div><button class="button" id="refresh">Refresh orders</button> <button class="button" id="signOut">Sign out</button></div></div><p id="status" class="status" role="status" aria-live="polite"></p><div class="table-wrap"><table><thead><tr><th>Order / date</th><th>Customer</th><th>Delivery address</th><th>Product</th><th>Qty</th><th>Subtotal</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
  const db=supabase.createClient("https://rfjcgbehvyybthprbvqm.supabase.co","sb_publishable_E7O9tR2EkZP6-RQFrWUySA_m-V1RCnB");
  const loginPanel=document.getElementById("loginPanel"),ordersPanel=document.getElementById("ordersPanel"),status=document.getElementById("status");
  const money=n=>`PKR ${new Intl.NumberFormat("en-PK",{maximumFractionDigits:0}).format(Number(n)||0)}`;
  function cell(row,text,className){const td=document.createElement("td");td.textContent=text||"—";if(className)td.className=className;row.appendChild(td);return td;}
  async function deleteOrder(orderId,button){if(!window.confirm("Delete this order permanently? This cannot be undone."))return;button.disabled=true;button.textContent="Deleting…";status.textContent="";status.className="status";const {data,error}=await db.from("orders").delete().eq("id",orderId).select("id");if(error||!data?.length){status.textContent=error?`Could not delete order: ${error.message}`:"Order was not deleted. Check that your account has the admin role.";status.classList.add("error");button.disabled=false;button.textContent="Delete";return;}await loadOrders();status.textContent="Order deleted.";}
  async function loadOrders(){status.textContent="Loading orders…";status.className="status";const {data,error}=await db.from("orders").select("id,created_at,status,customer_name,customer_phone,customer_email,delivery_address,city,province,postal_code,delivery_notes,product_id,product_name,product_price,quantity,total_amount,markaz_product_url").order("created_at",{ascending:false}).limit(500);if(error){status.textContent=`Could not load orders: ${error.message}`;status.classList.add("error");return;}const tbody=document.getElementById("rows");tbody.replaceChildren();for(const o of data||[]){const tr=document.createElement("tr");const d=new Date(o.created_at);cell(tr,`${o.id.slice(0,8)}\n${d.toLocaleString()}`);cell(tr,`${o.customer_name}\n${o.customer_phone}${o.customer_email?`\n${o.customer_email}`:""}`,"customer");cell(tr,[o.delivery_address,o.city,o.province,o.postal_code,o.delivery_notes].filter(Boolean).join(", "),"address");const product=cell(tr,"","product");const link=document.createElement("a");link.textContent=`${o.product_name} (ID ${o.product_id})`;link.href=o.markaz_product_url||`https://www.markaz.app/shop/product/${encodeURIComponent(o.product_id)}`;link.target="_blank";link.rel="noopener noreferrer";product.append(link);cell(tr,String(o.quantity));cell(tr,money(o.total_amount));cell(tr,o.status);const action=cell(tr,"");const remove=document.createElement("button");remove.type="button";remove.className="delete-button";remove.textContent="Delete";remove.setAttribute("aria-label",`Delete order ${o.id.slice(0,8)}`);remove.addEventListener("click",()=>deleteOrder(o.id,remove));action.append(remove);tbody.append(tr);}document.getElementById("count").textContent=`${data?.length||0} order(s)`;status.textContent="";}
  async function showSession(){const {data}=await db.auth.getSession();const signedIn=!!data.session;loginPanel.classList.toggle("hidden",signedIn);ordersPanel.classList.toggle("hidden",!signedIn);if(signedIn)loadOrders();}
  document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();status.textContent="";const {error}=await db.auth.signInWithPassword({email:document.getElementById("email").value,password:document.getElementById("password").value});if(error){const p=loginPanel.querySelector("p");p.textContent=error.message;p.className="status error";return;}await showSession();});
  document.getElementById("signOut").addEventListener("click",async()=>{await db.auth.signOut();await showSession();});document.getElementById("refresh").addEventListener("click",loadOrders);showSession();
</script></body></html>
